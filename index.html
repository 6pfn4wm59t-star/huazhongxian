<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>画中仙 · 未寄的红豆笺 · 古风剧本杀</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', '华文楷体', 'KaiTi', cursive, sans-serif;
      background: #0b0a0c;
      background-image: radial-gradient(circle at 20% 30%, #1a1420 0%, #0a0709 90%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .game-container {
      max-width: 820px;
      width: 100%;
      background: rgba(20, 15, 18, 0.88);
      backdrop-filter: blur(4px);
      border: 1px solid #7a5a4a;
      border-radius: 40px 40px 28px 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 1px #4a3530 inset;
      padding: 24px 22px 32px;
      color: #f0e3d4;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 6px;
      text-align: center;
      color: #f7d9c0;
      text-shadow: 0 0 12px #b3866a, 0 2px 0 #3f2820;
      margin-bottom: 4px;
      font-family: '华文楷体', 'KaiTi', cursive;
    }
    .subhead {
      text-align: center;
      font-size: 0.85rem;
      color: #b6967e;
      border-top: 1px solid #4d3630;
      border-bottom: 1px solid #4d3630;
      padding: 8px 0;
      margin-bottom: 16px;
      letter-spacing: 3px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .flex-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 8px 0; }
    .btn {
      background: #2a1d1a;
      border: 1px solid #6b4e40;
      color: #f0e0d0;
      padding: 8px 20px;
      border-radius: 60px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 0 #0f0908;
      font-family: inherit;
      letter-spacing: 1px;
      flex: 0 1 auto;
    }
    .btn:hover { background: #3f2a24; border-color: #a67a62; transform: translateY(-2px); box-shadow: 0 6px 0 #0f0908; }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0f0908; }
    .btn-primary { background: #6d3f30; border-color: #b28264; color: #ffeede; }
    .btn-gold { background: #7a5a3a; border-color: #c9a77b; color: #fff4e0; }
    .btn-sm { padding: 5px 14px; font-size: 0.75rem; }
    .card {
      background: #171013;
      border: 1px solid #3f2e26;
      border-radius: 28px;
      padding: 16px 18px;
      margin: 12px 0;
      box-shadow: inset 0 0 20px #0a0608, 0 8px 16px rgba(0,0,0,0.5);
    }
    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin: 10px 0;
    }
    .char-card {
      background: #1f1618;
      border: 2px solid #3d2e26;
      border-radius: 16px;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.15s;
      position: relative;
    }
    .char-card:hover { border-color: #7a5a4a; background: #2a1c1a; }
    .char-card.selected { border-color: #dbb48c; background: #2f1e1a; box-shadow: 0 0 20px #b2826440; }
    .char-card .avatar { font-size: 2.4rem; margin-bottom: 4px; }
    .char-card .name { font-weight: 600; color: #f0d5c0; font-size: 1rem; }
    .char-card .sub { font-size: 0.7rem; color: #b6967e; }
    .char-card .badge {
      position: absolute;
      top: -6px; right: -6px;
      background: #6d3f30;
      border-radius: 40px;
      padding: 2px 10px;
      font-size: 0.6rem;
      color: #fff;
      border: 1px solid #c9a77b;
    }
    .log-area {
      background: #0e0a0c;
      border: 1px solid #3a2a24;
      border-radius: 20px;
      padding: 12px 14px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #dacfc0;
      font-family: 'Courier New', monospace;
      margin: 8px 0;
    }
    .log-area .log-entry { border-bottom: 1px solid #2a1e1a; padding: 4px 0; }
    .log-area .log-entry:last-child { border: none; }
    .keyword-tag {
      display: inline-block;
      background: #2d1e1a;
      border: 1px solid #6b4e40;
      border-radius: 40px;
      padding: 3px 14px;
      margin: 3px 5px 3px 0;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.1s;
    }
    .keyword-tag.active { background: #6d3f30; border-color: #c9a77b; color: #fff; }
    .keyword-tag.used { opacity: 0.25; pointer-events: none; }
    .relationship-svg {
      width: 100%;
      aspect-ratio: 16/9;
      background: #0e0a0c;
      border-radius: 24px;
      border: 1px solid #3a2a24;
      margin: 8px 0;
    }
    .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    .text-glow { color: #f7d9c0; text-shadow: 0 0 8px #b3866a; }
    .text-muted { color: #a08474; font-size: 0.8rem; }
    hr { border: none; border-top: 1px solid #3f2e26; margin: 14px 0; }
    .hidden { display: none !important; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

    .secret-panel {
      background: #0d080a;
      border: 1px solid #5a3f30;
      border-radius: 20px;
      padding: 14px 16px;
      margin: 8px 0;
      border-left: 4px solid #b28264;
    }
    .secret-panel .label { color: #b6967e; font-size: 0.7rem; letter-spacing: 2px; }
    .secret-panel .content { color: #f7d9c0; margin-top: 4px; font-size: 0.9rem; line-height: 1.6; }

    .modal-overlay {
      position: fixed; top:0;left:0;width:100%;height:100%;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      display: flex; justify-content: center; align-items: center;
      z-index: 999; padding: 20px;
    }
    .modal-box {
      max-width: 520px; width: 100%;
      background: #1f1618;
      border: 1px solid #7a5a4a;
      border-radius: 40px;
      padding: 28px 26px;
      box-shadow: 0 20px 40px #000;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-box h3 { font-weight: 300; letter-spacing: 4px; color: #f7d9c0; margin-bottom: 12px; }
    .modal-box .info-row { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px solid #2a1e1a; }
    .modal-box .info-row .tag { color: #b6967e; min-width: 70px; }
  </style>
</head>
<body>

<div class="game-container" id="app">
  <h1>🖌️ 画中仙 · 未寄的红豆笺</h1>
  <div class="subhead">
    <span>🎋 大昭·永昌三年</span>
    <span>🌸 烟雨画楼</span>
    <span>⚡ 暗凶 · 心脉断裂</span>
  </div>

  <div class="flex-between">
    <span class="btn btn-sm" style="background:#2a1d1a;border-color:#5a4a3a;" id="phaseDisplay">第一幕 · 封笔画中人</span>
    <span style="font-size:0.75rem; color:#b6967e;" id="stepCounter">线索 0 / 7</span>
    <span style="font-size:0.75rem; color:#b6967e;" id="playerNameDisplay">👤 未选角色</span>
  </div>

  <!-- 选角 -->
  <div id="stepSelect" class="card">
    <div class="flex-between">
      <span style="font-weight:300; letter-spacing:2px;">🎴 选择你的角色</span>
      <span class="text-muted">点击头像，只能选1个</span>
    </div>
    <div class="character-grid" id="characterGrid"></div>
    <div class="flex-row">
      <button class="btn btn-primary" id="confirmMyRoleBtn">✓ 确认我的角色</button>
      <button class="btn btn-secondary" id="resetSelectionBtn">↺ 重选</button>
    </div>
    <div class="text-muted" style="text-align:center; margin-top:4px; font-size:0.8rem;">
      💡 选角后你将看到自己的完整秘密，<br>其他角色仅显示公开档案
    </div>
  </div>

  <!-- 游戏 -->
  <div id="gamePanel" class="hidden">
    <div class="secret-panel" id="mySecretPanel">
      <div class="label">🔒 我的秘密 · 仅你可见</div>
      <div class="content" id="mySecretContent">加载中...</div>
    </div>

    <div class="card" id="sceneCard">
      <div id="sceneTitle" style="font-size:1.1rem; font-weight:300; letter-spacing:2px;">📜 封笔 · 画中人</div>
      <div id="sceneDesc" style="margin:8px 0 4px; line-height:1.6; color:#dacfc0;">顾清宴倒在画案前，紫毫笔插心，画上写「九」……</div>
    </div>

    <div class="card">
      <div class="flex-between">
        <span>👥 查看角色档案（点击头像）</span>
        <span class="text-muted">朋友的角色只看公开信息</span>
      </div>
      <div class="character-grid" id="otherCharGrid" style="grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));"></div>
    </div>

    <div class="card">
      <div class="flex-between">
        <span>🔍 盘问 · 选择对象 + 关键词</span>
        <span class="text-muted" id="askHint">解锁公共线索</span>
      </div>
      <div class="flex-row" style="justify-content:flex-start; gap:6px; flex-wrap:wrap;" id="targetSelector"></div>
      <div style="margin: 8px 0;">
        <span style="font-size:0.75rem; color:#b6967e;">关键词池：</span>
        <div id="keywordPool" style="display:flex; flex-wrap:wrap; gap:3px; margin-top:4px;"></div>
      </div>
      <div class="flex-row" style="justify-content:space-between;">
        <button class="btn btn-gold btn-sm" id="askBtn">⚡ 盘问</button>
        <button class="btn btn-secondary btn-sm" id="nextSceneBtn">▶ 推进剧情</button>
      </div>
    </div>

    <div class="card" style="padding: 10px;">
      <div class="flex-between">
        <span>🕸️ 关系图 · 公共</span>
        <span class="text-muted" id="relationCount">0 条连线</span>
      </div>
      <svg class="relationship-svg" id="relationSvg" viewBox="0 0 400 200"></svg>
    </div>

    <div class="card" style="padding: 10px;">
      <div class="flex-between">
        <span>📖 公共日志</span>
        <button class="btn btn-sm btn-secondary" id="clearLogBtn">清空</button>
      </div>
      <div class="log-area" id="logArea"></div>
    </div>

    <div class="flex-row" id="endingSection" style="margin-top:10px;">
      <button class="btn btn-gold" id="endingResetBtn">🔴 封画</button>
      <button class="btn btn-primary" id="endingButterflyBtn">🟢 焚笔</button>
    </div>
  </div>
</div>

<!-- 模态框 -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-box fade-in" id="modalBox">
    <h3 id="modalTitle">👤 角色档案</h3>
    <div id="modalBody" style="margin: 12px 0; line-height:1.8; color:#dacfc0; font-size:0.9rem;"></div>
    <button class="btn btn-primary" id="modalCloseBtn">关闭</button>
  </div>
</div>

<script>
  (function(){
    // ---------- 角色数据 ----------
    const CHARACTERS = [
      { 
        id: 'shen', name: '沈清墨', emoji: '🎨', title: '大弟子·私生女',
        publicDesc: '顾清宴关门弟子，天赋极高，擅长画仕女。',
        privateSecret: '🔒 你是顾清宴的女儿——私生女。你娘被画进《百美图》后「消失」了。你学画十年，就是为了有一天能画她出来。昨夜你问他：「娘在哪一幅画里？」他指了指第九十九幅，没说话。你是【无辜】的。',
        knowMode: '无辜',
        isMurderer: false,
        action: '戌时二刻 问画，未碰笔'
      },
      { 
        id: 'bai', name: '白素衣', emoji: '🌙', title: '御用模特·无影人',
        publicDesc: '画楼最美的模特，九十八幅美人图的原型。',
        privateSecret: '🔒 你是唯一一个被顾清宴画进画里、又画出来的人。但他少画了一笔——你的影子。你的影子还在画里，你永远不完整。你偷了笔想补影子，但没来得及。你是【无辜】的。',
        knowMode: '无辜',
        isMurderer: false,
        action: '戌时 偷笔，未动手'
      },
      { 
        id: 'lu', name: '陆青崖', emoji: '📜', title: '画商·赠笔者',
        publicDesc: '江南最大画铺的主人，顾清宴的旧友。',
        privateSecret: '🔒 那支「摄魂笔」是你送给他的。你从西域购得，传说「画谁谁入画，画活即成真」。你后悔了，昨夜去抢回，但他拒绝了。你抢到笔时他还活着。你是【无辜】的。',
        knowMode: '无辜',
        isMurderer: false,
        action: '戌时二刻 抢笔，离开时顾清宴仍在呼吸'
      },
      { 
        id: 'xue', name: '薛泠音', emoji: '🎵', title: '琴师·被背叛者',
        publicDesc: '住在画楼十年，日日为顾清宴抚琴，红颜知己。',
        privateSecret: '🔒 他答应你画完第九十九幅就娶你。但昨夜你发现——画里的人不是你，是沈清墨的娘。你拿起紫毫笔想画毁那幅画，然后他倒了。你刺了他——但你刺下去时他已经没有呼吸了。你是【暗凶】，但你不确定他是不是死在你手里。',
        knowMode: '暗凶',
        isMurderer: true,
        action: '戌时三刻 举笔刺入，顾清宴当时已心脉断裂'
      },
      { 
        id: 'jiang', name: '江雪吟', emoji: '❄️', title: '书童·画中人',
        publicDesc: '从小在画楼长大，顾清宴视如己出。',
        privateSecret: '🔒 你是一幅画成精。顾清宴年轻时画了《少年踏雪图》，画里的少年活了过来，就是你。你看见薛泠音举着笔站在顾清宴面前，然后他倒了。你喊了一声，她跑了。你是【无辜】的。',
        knowMode: '无辜',
        isMurderer: false,
        action: '戌时三刻 目击薛泠音举笔，顾清宴已倒地'
      }
    ];

    // 死者
    const DEAD = { id: 'gu', name: '顾清宴', emoji: '💔', title: '楼主·死者', publicDesc: '江南第一画师，《百美图》作者，死前写「九」。不可选。' };

    const KEYWORDS = ['私生女', '影子', '摄魂笔', '第九十九幅', '画中人', '心脉断裂', '紫毫笔', '百美图', '封笔', '绝笔信', '画楼', '焚笔'];
    const SCENES = [
      { id: 0, title: '第一幕 · 封笔画中人', desc: '顾清宴封笔之夜，紫毫笔插心，画上写「九」。《百美图》第九十九幅沾血，画面模糊……' },
      { id: 1, title: '第二幕 · 百美图千面人心', desc: '搜证发现：私生女、无影人、摄魂笔的真相。每个人都被困在画里……' },
      { id: 2, title: '第三幕 · 最后一笔还你自由', desc: '真相揭晓：薛泠音刺了尸体，顾清宴心脉断裂而亡。他用自己的死换所有人自由。' }
    ];

    const CLUES = [
      { id: 'c1', trigger: ['私生女','沈清墨'], text: '沈清墨哭诉：「他是我爹。我娘被他画进第九十九幅画里，再也没有出来。我学画十年，就是为了画她出来。」' },
      { id: 'c2', trigger: ['影子','白素衣'], text: '白素衣背后有一块空白——她没有影子。「他把我的影子留在画里了。我一辈子都不完整。」' },
      { id: 'c3', trigger: ['摄魂笔','陆青崖'], text: '陆青崖坦白：「那支笔是我送他的。西域来的邪物，画谁谁入画。我后悔了。昨晚我去抢回来，但他拒绝了。」' },
      { id: 'c4', trigger: ['第九十九幅','薛泠音'], text: '薛泠音崩溃：「他说第九十九幅画的是我。但昨夜我看见了——是沈清墨的娘。他骗了我十年。」' },
      { id: 'c5', trigger: ['画中人','江雪吟'], text: '江雪吟说：「我喊了一声，薛泠音跑了。但顾先生那时候……已经没有呼吸了。我看到他嘴角在笑。」' },
      { id: 'c6', trigger: ['心脉断裂','绝笔信'], text: '顾清宴的绝笔信在笔管里被发现：「我用一条命还你们自由。第九十九幅画的是我自己——一个跪着赎罪的人。」' },
      { id: 'c7', trigger: ['紫毫笔','百美图'], text: '紫毫笔在顾清宴死后自己画了一笔——把白素衣的影子从画里吸了出来，还给了她。' }
    ];

    // ---------- 状态 ----------
    let state = {
      myRoleId: null,
      sceneIndex: 0,
      keywordsUsed: [],
      unlockedClues: [],
      log: [],
      relations: [],
      endingChosen: null,
    };

    // DOM
    const $ = id => document.getElementById(id);
    const phaseDisplay = $('phaseDisplay');
    const stepCounter = $('stepCounter');
    const playerNameDisplay = $('playerNameDisplay');
    const characterGrid = $('characterGrid');
    const confirmBtn = $('confirmMyRoleBtn');
    const resetSelBtn = $('resetSelectionBtn');
    const gamePanel = $('gamePanel');
    const stepSelect = $('stepSelect');
    const sceneTitle = $('sceneTitle');
    const sceneDesc = $('sceneDesc');
    const targetSelector = $('targetSelector');
    const keywordPool = $('keywordPool');
    const askBtn = $('askBtn');
    const nextSceneBtn = $('nextSceneBtn');
    const logArea = $('logArea');
    const relationSvg = $('relationSvg');
    const relationCount = $('relationCount');
    const endingSection = $('endingSection');
    const endingResetBtn = $('endingResetBtn');
    const endingButterflyBtn = $('endingButterflyBtn');
    const modalOverlay = $('modalOverlay');
    const modalTitle = $('modalTitle');
    const modalBody = $('modalBody');
    const modalCloseBtn = $('modalCloseBtn');
    const clearLogBtn = $('clearLogBtn');
    const askHint = $('askHint');
    const mySecretContent = $('mySecretContent');
    const otherCharGrid = $('otherCharGrid');

    function getMyChar() { return CHARACTERS.find(c => c.id === state.myRoleId); }
    function addLog(msg, type='info') {
      state.log.unshift({ msg, type, time: new Date().toLocaleTimeString() });
      renderLog();
    }
    function renderLog() {
      logArea.innerHTML = state.log.slice(0, 30).map(e => 
        `<div class="log-entry">[${e.time}] ${e.msg}</div>`
      ).join('');
    }

    // 选角
    function renderCharSelection() {
      const all = [...CHARACTERS, { ...DEAD, id: 'dead', selectable: false }];
      characterGrid.innerHTML = all.map(ch => {
        if (ch.id === 'dead') {
          return `<div class="char-card" style="opacity:0.5;cursor:default;border-color:#3a2a24;">
            <div class="avatar">${ch.emoji}</div>
            <div class="name">${ch.name}</div>
            <div class="sub">${ch.title} · 不可选</div>
          </div>`;
        }
        const sel = state.myRoleId === ch.id ? 'selected' : '';
        return `<div class="char-card ${sel}" data-id="${ch.id}">
          <div class="avatar">${ch.emoji}</div>
          <div class="name">${ch.name}</div>
          <div class="sub">${ch.title}</div>
          ${sel ? '<div class="badge">我的角色</div>' : ''}
        </div>`;
      }).join('');
      document.querySelectorAll('.char-card[data-id]').forEach(el => {
        el.addEventListener('click', function() {
          const id = this.dataset.id;
          if (state.myRoleId === id) state.myRoleId = null;
          else state.myRoleId = id;
          renderCharSelection();
          const my = getMyChar();
          confirmBtn.textContent = my ? `✓ 扮演 ${my.name}` : '✓ 确认我的角色';
        });
      });
    }

    function renderOtherChars() {
      const my = getMyChar();
      if (!my) { otherCharGrid.innerHTML = ''; return; }
      const others = CHARACTERS.filter(c => c.id !== state.myRoleId);
      otherCharGrid.innerHTML = others.map(ch => 
        `<div class="char-card" data-id="${ch.id}" style="cursor:pointer;padding:8px;">
          <div class="avatar" style="font-size:1.8rem;">${ch.emoji}</div>
          <div class="name" style="font-size:0.85rem;">${ch.name}</div>
          <div class="sub">${ch.title}</div>
        </div>`
      ).join('');
      otherCharGrid.querySelectorAll('.char-card').forEach(el => {
        el.addEventListener('click', function() {
          const ch = CHARACTERS.find(c => c.id === this.dataset.id);
          if (ch) showPublicProfile(ch);
        });
      });
    }

    function showPublicProfile(ch) {
      modalTitle.textContent = `${ch.emoji} ${ch.name} · 公开档案`;
      modalBody.innerHTML = `
        <div class="info-row"><span class="tag">身份</span><span>${ch.title}</span></div>
        <div class="info-row"><span class="tag">简述</span><span>${ch.publicDesc}</span></div>
        <div class="info-row"><span class="tag">公开行动</span><span>${ch.action || '未知'}</span></div>
        <div style="margin-top:12px;padding:10px;background:#0d080a;border-radius:12px;border-left:3px solid #5a3f30;">
          <span style="color:#b6967e;font-size:0.7rem;">📌 私密内容仅该角色玩家可见</span>
        </div>
      `;
      modalOverlay.classList.remove('hidden');
    }

    function renderMySecret() {
      const my = getMyChar();
      if (!my) { mySecretContent.textContent = '请先选择角色'; return; }
      const killerBadge = my.isMurderer ? ' ⚠️ 暗凶嫌疑' : '';
      mySecretContent.innerHTML = `
        <div><strong>${my.emoji} ${my.name}</strong> · ${my.title} ${killerBadge}</div>
        <div style="margin-top:6px;color:#f0d5c0;">${my.privateSecret}</div>
        <div style="margin-top:6px;font-size:0.8rem;color:#b6967e;">📌 知凶模式：${my.knowMode}</div>
        <div style="margin-top:4px;font-size:0.8rem;color:#b6967e;">⏱ 昨夜行动：${my.action}</div>
        ${my.isMurderer ? `<div style="margin-top:8px;padding:8px;background:#3f1a1a;border-radius:12px;border:1px solid #7a3a3a;color:#f7d0c0;font-size:0.85rem;">⚠️ 你刺了他，但刺下去时他已断气。你可能是真凶，也可能刺了尸体。通过盘问寻找真相。</div>` : ''}
      `;
      playerNameDisplay.textContent = `👤 ${my.name}`;
    }

    function renderKeywords() {
      keywordPool.innerHTML = KEYWORDS.map(kw => {
        const used = state.keywordsUsed.includes(kw);
        return `<span class="keyword-tag ${used?'used':''}" data-keyword="${kw}">${kw}</span>`;
      }).join('');
      document.querySelectorAll('.keyword-tag:not(.used)').forEach(el => {
        el.addEventListener('click', function() { this.classList.toggle('active'); });
      });
    }

    function renderTargets() {
      targetSelector.innerHTML = CHARACTERS.map(ch => 
        `<button class="btn btn-sm btn-secondary target-btn" data-id="${ch.id}">${ch.emoji} ${ch.name}</button>`
      ).join('');
      const btns = targetSelector.querySelectorAll('.target-btn');
      if (btns.length) btns[0].classList.add('btn-gold');
      btns.forEach(btn => {
        btn.addEventListener('click', function() {
          btns.forEach(b => b.classList.remove('btn-gold'));
          this.classList.add('btn-gold');
        });
      });
    }

    function getSelectedTarget() {
      const active = targetSelector.querySelector('.btn-gold');
      return active ? active.dataset.id : null;
    }
    function getSelectedKeywords() {
      const active = keywordPool.querySelectorAll('.keyword-tag.active:not(.used)');
      return Array.from(active).map(el => el.dataset.keyword);
    }

    function tryUnlockClue(keywords) {
      if (keywords.length === 0) return null;
      for (let clue of CLUES) {
        if (state.unlockedClues.includes(clue.id)) continue;
        if (clue.trigger.every(t => keywords.includes(t))) {
          state.unlockedClues.push(clue.id);
          clue.trigger.forEach(k => {
            if (!state.keywordsUsed.includes(k)) state.keywordsUsed.push(k);
          });
          addRelation(clue.id);
          return clue;
        }
      }
      return null;
    }

    function addRelation(clueId) {
      const pairs = {
        'c1': ['shen','gu'], 'c2': ['bai','gu'], 'c3': ['lu','gu'],
        'c4': ['xue','gu'], 'c5': ['jiang','gu'], 'c6': ['gu','shen'], 'c7': ['bai','gu']
      };
      const p = pairs[clueId];
      if (p && !state.relations.some(r => r.a===p[0] && r.b===p[1])) {
        state.relations.push({ a: p[0], b: p[1], label: clueId });
        renderRelation();
      }
    }

    function renderRelation() {
      const svg = relationSvg;
      const w=400,h=200;
      const pos = {
        shen:{x:60,y:70}, bai:{x:150,y:30}, lu:{x:250,y:30},
        xue:{x:150,y:170}, jiang:{x:250,y:170}, gu:{x:340,y:100}
      };
      const names = Object.fromEntries(CHARACTERS.map(c=>[c.id,c.name]));
      names.gu = '顾清宴';
      let html = `<rect width="${w}" height="${h}" fill="#0e0a0c" rx="16" />`;
      state.relations.forEach(r => {
        const p1=pos[r.a], p2=pos[r.b];
        if (p1&&p2) {
          const isRed = r.a==='xue'&&r.b==='gu' || r.a==='gu'&&r.b==='xue';
          html += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${isRed?'#b23a3a':'#b28264'}" stroke-width="${isRed?'3':'2'}" opacity="0.7" />`;
          const mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2-8;
          html += `<text x="${mx}" y="${my}" fill="#a08474" font-size="8" text-anchor="middle">✦</text>`;
        }
      });
      Object.entries(pos).forEach(([id,p]) => {
        const name = names[id]||id;
        const isMy = state.myRoleId === id;
        const isDead = id === 'gu';
        const fill = isDead ? '#1a0a0a' : (isMy ? '#6d3f30' : '#2a1d1a');
        const stroke = isDead ? '#5a2a2a' : (isMy ? '#c9a77b' : '#5a4a3a');
        html += `<circle cx="${p.x}" cy="${p.y}" r="${isDead?10:14}" fill="${fill}" stroke="${stroke}" stroke-width="2" />`;
        html += `<text x="${p.x}" y="${p.y+4}" fill="${isDead?'#6a4a4a':'#f0e0d0'}" font-size="${isDead?7:8}" text-anchor="middle">${isDead?'顾':name.slice(0,2)}</text>`;
      });
      svg.innerHTML = html;
      relationCount.textContent = state.relations.length + ' 条连线';
    }

    function updatePhaseUI() {
      const scene = SCENES[state.sceneIndex] || SCENES[0];
      phaseDisplay.textContent = scene.title;
      sceneTitle.textContent = scene.title;
      sceneDesc.textContent = scene.desc;
      stepCounter.textContent = `线索 ${state.unlockedClues.length} / 7`;
      if (state.sceneIndex >= 2) endingSection.classList.remove('hidden');
      else endingSection.classList.add('hidden');
      nextSceneBtn.textContent = state.sceneIndex >= 2 ? '🔄 重演真相' : '▶ 推进剧情';
    }

    function checkSceneProgress() {
      const s = state.sceneIndex;
      if (s===0 && state.unlockedClues.length>=2) return true;
      if (s===1 && state.unlockedClues.length>=4) return true;
      if (s===2 && state.unlockedClues.length>=6) return true;
      return false;
    }

    function showModal(title, body) {
      modalTitle.textContent = title;
      modalBody.innerHTML = body;
      modalOverlay.classList.remove('hidden');
    }

    // 盘问
    function handleAsk() {
      const target = getSelectedTarget();
      const keywords = getSelectedKeywords();
      if (!target) { alert('请选择盘问对象'); return; }
      if (keywords.length===0) { alert('请选择关键词'); return; }
      const ch = CHARACTERS.find(c=>c.id===target);
      if (!ch) return;
      const clue = tryUnlockClue(keywords);
      if (clue) {
        addLog(`🔓 解锁: ${clue.text} (对 ${ch.name} 盘问)`, 'clue');
        if (clue.id==='c4' && state.myRoleId==='xue') {
          showModal('⚠️ 你的暗凶浮现', '你（薛泠音）发现了真相：<br>「他说第九十九幅画的是我，但画里是沈清墨的娘。」<br><br>你刺了他。但你刺下去时，他已经没有呼吸了。<br>你可能是凶手，也可能只是刺了一具尸体。');
        }
        if (clue.id==='c6') {
          showModal('🖌️ 绝笔信', '顾清宴的信被找到：<br>「我用一条命还你们自由。第九十九幅画的是我自己——一个跪着赎罪的人。」<br><br>他用自己的死，换画中人的自由。');
        }
        if (clue.id==='c7') {
          showModal('🌙 影子的归还', '紫毫笔自己画了一笔——<br>白素衣的影子从画里飞出来，回到了她身上。<br>她第一次有了完整的影子。');
        }
        renderKeywords();
        renderTargets();
        updatePhaseUI();
        if (state.unlockedClues.length>=6) addLog('💫 所有关键线索已解锁，真相浮出水面', 'info');
      } else {
        addLog(`❓ 盘问 ${ch.name} [${keywords.join(', ')}] 未解锁`, 'info');
        keywordPool.querySelectorAll('.keyword-tag.active').forEach(el=>el.classList.remove('active'));
      }
    }

    function nextScene() {
      if (state.sceneIndex<2) {
        if (!checkSceneProgress()) {
          alert(`需解锁 ${state.sceneIndex===0?2:4} 条线索 (当前 ${state.unlockedClues.length})`);
          return;
        }
        state.sceneIndex++;
        addLog(`📌 进入 ${SCENES[state.sceneIndex].title}`, 'info');
        if (state.sceneIndex===2) {
          addLog('🖌️ 最终幕：最后一笔·还你自由', 'info');
          endingSection.classList.remove('hidden');
          if (!state.unlockedClues.includes('c6')) {
            state.unlockedClues.push('c6');
            state.keywordsUsed.push('心脉断裂','绝笔信');
            addLog('🔓 自动解锁: 绝笔信被发现——「我用一条命还你们自由。」', 'clue');
            renderRelation();
          }
        }
        updatePhaseUI();
        renderRelation();
      } else {
        showModal('🖌️ 画中仙·未寄的红豆笺', `
          <p style="color:#f7d9c0;">三重反转：</p>
          <p>1️⃣ 薛泠音刺了顾清宴，但刺下去时他已经心脉断裂——他看见画里的沈清墨娘对他笑了，激动而亡。</p>
          <p>2️⃣ 顾清宴是故意的。他用死换画中人自由——最后一幅画里，他画了一个跪着的自己。</p>
          <p>3️⃣ 紫毫笔自己画了一笔——把白素衣的影子还给了她。她终于完整了。</p>
          <br>
          <p style="color:#b6967e;">「我画了一辈子美人，最后发现，最该画的是我自己。」</p>
        `);
      }
    }

    function chooseEnding(type) {
      if (state.endingChosen) return;
      state.endingChosen = type;
      const isReset = type === 'reset';
      addLog(isReset ? '🔴 封画：百美图封存，各奔东西' : '🟢 焚笔：烟雨画楼改为百美祠', 'ending');
      showModal(isReset ? '🔴 封画' : '🟢 焚笔', isReset ? `
        <p>所有人决定把《百美图》封存，永不开启。</p>
        <p>紫毫笔被砸碎，沉入湖底。</p>
        <p>画楼关闭，各奔东西。</p>
        <p>沈清墨带着母亲的画回到故乡，每年清明烧一幅自己的画给母亲。</p>
        <p>白素衣终身未嫁，因为她觉得「影子是借来的」。</p>
        <p>薛泠音在废墟上建了一座小庵，每天弹琴，弹到老。</p>
        <p>江雪吟站在空荡荡的画楼里，说了一句：</p>
        <p style="color:#b6967e;">「我是画，但我现在，画不下去了。」</p>
      ` : `
        <p>陆青崖把紫毫笔烧了。烟雨画楼改为「百美祠」。</p>
        <p>沈清墨成为新主人，画了一幅《一个跪着的人》挂在正堂。</p>
        <p>白素衣第一次有了完整的影子，在镜子前哭了一整夜。</p>
        <p>薛泠音自首，官府判她「情有可原」，她出家为尼，法号「了尘」。</p>
        <p>江雪吟站在画楼门口，第一次觉得——</p>
        <p style="color:#f7d9c0;">自己像个人了。</p>
      `);
      endingResetBtn.disabled = true;
      endingButterflyBtn.disabled = true;
    }

    function confirmMyRole() {
      if (!state.myRoleId) { alert('请选择角色'); return; }
      stepSelect.classList.add('hidden');
      gamePanel.classList.remove('hidden');
      renderMySecret();
      renderOtherChars();
      renderKeywords();
      renderTargets();
      renderRelation();
      updatePhaseUI();
      const my = getMyChar();
      addLog(`🖌️ 你已扮演 ${my.name}，请保守秘密`, 'info');
      if (my.isMurderer) addLog('🔴 私密：你刺了他，但刺下去时他已断气——你可能是真凶', 'info');
    }

    function resetGame() {
      state.myRoleId = null;
      state.sceneIndex = 0;
      state.keywordsUsed = [];
      state.unlockedClues = [];
      state.log = [];
      state.relations = [];
      state.endingChosen = null;
      gamePanel.classList.add('hidden');
      stepSelect.classList.remove('hidden');
      renderCharSelection();
      confirmBtn.textContent = '✓ 确认我的角色';
      endingResetBtn.disabled = false;
      endingButterflyBtn.disabled = false;
      endingSection.classList.add('hidden');
      logArea.innerHTML = '';
      renderRelation();
      updatePhaseUI();
      playerNameDisplay.textContent = '👤 未选角色';
    }

    // 初始化
    function init() {
      renderCharSelection();
      renderKeywords();
      renderTargets();
      renderRelation();
      updatePhaseUI();
      addLog('🖌️ 欢迎来到《画中仙·未寄的红豆笺》', 'info');
      addLog('🎭 请选择你的角色，私密内容仅你可见', 'info');

      confirmBtn.addEventListener('click', confirmMyRole);
      resetSelBtn.addEventListener('click', ()=>{
        state.myRoleId = null;
        renderCharSelection();
        confirmBtn.textContent = '✓ 确认我的角色';
      });
      askBtn.addEventListener('click', handleAsk);
      nextSceneBtn.addEventListener('click', nextScene);
      clearLogBtn.addEventListener('click', ()=>{ state.log=[]; renderLog(); });
      endingResetBtn.addEventListener('click', ()=>chooseEnding('reset'));
      endingButterflyBtn.addEventListener('click', ()=>chooseEnding('butterfly'));
      modalCloseBtn.addEventListener('click', ()=>modalOverlay.classList.add('hidden'));
      modalOverlay.addEventListener('click', (e)=>{
        if (e.target===modalOverlay) modalOverlay.classList.add('hidden');
      });
      document.addEventListener('keydown', (e)=>{
        if (e.key==='r'&&e.ctrlKey) { e.preventDefault(); if(confirm('重置游戏？')) resetGame(); }
      });
    }
    init();
  })();
</script>
</body>
</html>
